[package]
name = "canonical-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Canonical Cloud compliance quote domain types and validation"
license = "MIT"
repository = "https://github.com/canonical-cloud/canonical-lib"

[lib]
path = "src/root.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
canonical-interfaces = { version = "=0.1.0", git = "https://github.com/canonical-cloud/canonical-interfaces", rev = "0cab33c2b2a494d2368ef1da0ebe5d614b3a96ef" }

[lints.rust]
unsafe_code = "forbid"
