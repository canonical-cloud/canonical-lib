name: Recover preserved canonical-lib Git history

on:
  push:
    branches:
      - ops/import-preserved-canonical-lib-20260902
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-preserved-canonical-lib-history
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'canonical-cloud/canonical-lib'
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify bundle and publish collision-safe refs
        shell: bash
        env:
          BUNDLE: .git-recovery/canonical-lib-20260806.bundle
          PREFIX: recovery/20260806/canonical-lib
        run: |
          set -euo pipefail
          test -s "$BUNDLE"
          git bundle verify "$BUNDLE"
          git fetch "$BUNDLE" 'refs/heads/*:refs/remotes/preserved-canonical-lib/*'

          imported=0
          while read -r sha ref; do
            case "$ref" in
              refs/heads/*)
                source_branch="${ref#refs/heads/}"
                target_branch="$PREFIX/$source_branch"
                existing="$(git ls-remote --heads origin "refs/heads/$target_branch" | awk '{print $1}')"
                if [[ -n "$existing" && "$existing" != "$sha" ]]; then
                  echo "Ref collision: $target_branch already points to $existing, expected $sha" >&2
                  exit 1
                fi
                if [[ "$existing" == "$sha" ]]; then
                  echo "Already published: $target_branch -> $sha"
                else
                  git push origin "$sha:refs/heads/$target_branch"
                  echo "Published: $target_branch -> $sha"
                fi
                imported=$((imported + 1))
                ;;
            esac
          done < <(git bundle list-heads "$BUNDLE")

          test "$imported" -gt 0
          {
            echo '## Preserved Git history import'
            echo
            echo "Imported $imported branch ref(s) from \`$BUNDLE\`."
            echo 'Existing refs were never force-updated.'
          } >> "$GITHUB_STEP_SUMMARY"
